services:
  warden-proxy:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: autollm/warden:latest
    container_name: warden-proxy
    command: ["warden-proxy"]
    ports:
      # Bind to loopback only. Plain "8080:8080" exposes on 0.0.0.0 — anyone
      # on the LAN (or, if a router forwards 8080, anyone on the internet)
      # can use this as an open proxy. Once install-mac.sh enables the
      # system proxy here, off-host scanners saturate mitmproxy at hundreds
      # of conns/sec and the user's own loopback flows queue behind them,
      # which manifests as "every site times out" + intermittent SSL errors
      # under load. (Observed on macOS with WARP/VPN active: traffic looped
      # back through Cloudflare anycast IPs; ~91k off-host conns/min logged
      # before this change.)
      - "127.0.0.1:8080:8080"   # the HTTP/HTTPS proxy port
    networks:
      - warden-net
    volumes:
      - warden-data:/data       # SQLite event store
      - warden-models:/models   # bpe.json + lstm.pt
      - warden-mitm:/home/mitmproxy/.mitmproxy   # CA certificate
    environment:
      - WARDEN_DB=/data/warden.db
      - WARDEN_MODEL_DIR=/models
      - WARDEN_AUTOTRAIN=1
      - WARDEN_TRAIN_SAMPLES=8000
      - WARDEN_TRAIN_EPOCHS=4
      # Set to 1 to dump full request bodies to /data/warden-test-mode.jsonl
      # for offline analysis / model training. Off by default.
      - WARDEN_TEST_MODE=${WARDEN_TEST_MODE:-0}
      - WARDEN_TEST_MODE_PATH=/data/warden-test-mode.jsonl
      # Kill switch for the SSE/chunked response tap. Set to 0 to fall
      # back to historic stream-passthrough (response classification is
      # then silently skipped for streaming endpoints — Anthropic /v1/
      # messages, OpenAI /v1/chat/completions, Gemini etc.). Use this if
      # the tap interacts badly with a specific client; flipping to 0 +
      # `docker compose up -d warden-proxy` rolls back in ~1 second
      # without a rebuild.
      - WARDEN_TAP_STREAMS=${WARDEN_TAP_STREAMS:-1}
      # Hard-block responses whose label lands in WARDEN_GUARDRAIL_LABELS
      # (default critical,high). Off by default — observation-only mode
      # is the right default until you trust the classifier on YOUR
      # traffic. Flip to 1 once you've audited a week of response events
      # and confirmed no false positives at high/critical.
      - WARDEN_GUARDRAIL_RESPONSES=${WARDEN_GUARDRAIL_RESPONSES:-0}
      # Deep-trace mode. When 1, entrypoint.sh also starts tcpdump,
      # loads debug_addon.py, and bumps mitmdump verbosity. Artifacts
      # land in /data (warden-cap.pcap, warden-deep-trace.jsonl,
      # warden-sockets.log, warden-tcpdump.log). Off by default.
      - WARDEN_DEEP_TRACE=${WARDEN_DEEP_TRACE:-0}
    cap_add:
      # tcpdump needs NET_RAW / NET_ADMIN to put eth0 in promisc mode.
      # No-op when WARDEN_DEEP_TRACE=0; container drops back to the
      # default capability set as far as runtime behavior goes.
      - NET_RAW
      - NET_ADMIN
    user: "0:0"   # need write access to /home/mitmproxy/.mitmproxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "ls /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  warden-api:
    image: autollm/warden:latest
    container_name: warden-api
    command: ["warden-api"]
    depends_on:
      - warden-proxy
    ports:
      # Loopback only — same reasoning as warden-proxy above. The dashboard
      # has no auth and exposes captured event bodies; never publish it.
      - "127.0.0.1:8090:8090"   # dashboard + JSON API
    networks:
      - warden-net
    volumes:
      - warden-data:/data
      - warden-models:/models
    environment:
      - WARDEN_DB=/data/warden.db
      - WARDEN_MODEL_DIR=/models
      - WARDEN_FRONTEND_DIR=/app/frontend
      - WARDEN_TEST_MODE=${WARDEN_TEST_MODE:-0}
      - WARDEN_TEST_MODE_PATH=/data/warden-test-mode.jsonl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  warden-data:
  warden-models:
  warden-mitm:

# Custom bridge with explicit MTU. Default Docker bridge is 1500, but on
# macOS the path container → vpnkit → host can clamp lower (utun tunnels
# on this host run as low as 1000 MTU). When server-side TLS records
# don't fit and ICMP "Frag Needed" doesn't propagate back through vpnkit,
# the handshake hangs at exact cert delivery moment — diag showed this
# pattern: openssl s_client to mail.google.com:443 from inside the
# container hung after sending ClientHello, reproducing the user's
# "every site times out when warden is on" symptom. 1380 is a safe value
# (matches utun1's MTU on this host and Apple's iCloud Private Relay
# typical MTU). If still failing, drop to 1280 (IPv6 minimum).
networks:
  warden-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1280
